[project]
name = "gswa-hackathon"
version = "0.1.0"
description = "Reproducible GSWA HyLogger and gold-assay analysis"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.1",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
